<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hafizia Shade Card Index</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: row;
            height: 100vh;
        }
        
        /* Left column for the links */
        .index {
            width: 250px;
            background-color: #f4f4f4;
            padding: 20px;
            height: 100%;
            overflow-y: auto;
        }
        
        .index a {
            display: block;
            margin: 10px 0;
            padding: 8px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            text-align: center;
        }

        .index a:hover {
            background-color: #0056b3;
        }

        /* Heading style */
        h1 {
            text-align: center;
            font-size: 24px;
            margin-top: 20px;
            color: #333;
        }

        /* Right column for image preview */
        .image-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #eaeaea;
            height: 100%;
        }

        .image-container img {
            max-width: 100%;
            max-height: 100%;
            display: none;
        }

        /* Download button style */
        .download-link {
            position: fixed;
            top: 10px;
            right: 10px;
            padding: 5px 10px;
            font-size: 12px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .download-link:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <!-- Left side for links -->
    <div class="index">
        <h1>Hafizia Shade Card Index</h1>
        <a href="#" data-image="https://dl.dropboxusercontent.com/scl/fi/gbupwoqp9uhqf9w2j4ruk/Cotton-PNP-2-6.jpg?rlkey=gc0lb2rvuxelwsik0j6834hqp&dl=1">Cotton PNP</a>
        <a href="#" data-image="https://dl.dropboxusercontent.com/scl/fi/p06e6n9mpo1zuibavboor/PET-2-Ply.jpg?rlkey=zw4b06bbu6t3vyzkiuzwv8vu4&dl=1">PET 2 Ply</a>
        <a href="#" data-image="https://dl.dropboxusercontent.com/scl/fi/zgpcoyl3jf8d1c93381lm/Series-PET-BOUCLE.jpg?rlkey=3mk8w4i201vj070mkkzpr5aqu&dl=1">PET Boucle</a>
        <a href="#" data-image="https://dl.dropboxusercontent.com/scl/fi/tiv0kp233qnbdl7v7sdef/Series-PL.jpg?rlkey=6suz2t3zh58b1tgiybethlock&dl=1">PET - PL</a>
        <a href="#" data-image="https://dl.dropboxusercontent.com/scl/fi/bc27k1spzflh20n1ifi5m/PP-SL.jpg?rlkey=7tlbmyyoqr6qcw5tixxuxzobf&dl=1">PP - SL</a>
        <a href="#" data-image="https://dl.dropboxusercontent.com/scl/fi/9xqu6arl26r43e6ubr4hj/PP-MM-TX.jpg?rlkey=iqq1s2xw6hmrdep8bnixdi51m&dl=1">PP - MM+TX</a>
        <a href="#" data-image="https://dl.dropboxusercontent.com/scl/fi/bd6mpmm0tl4ovw15uc4ol/Series-BL.jpg?rlkey=qfb2jv1e24f2p7aqageqnzw4t&dl=1">PP - BL</a>
        <a href="#" data-image="https://dl.dropboxusercontent.com/scl/fi/vg4rntjlz0ogv7th6l3h9/PVC.jpg?rlkey=dixfseb9w6x5y5h92j4uqcyxo&dl=1">PVC</a>
        <a href="#" data-image="https://dl.dropboxusercontent.com/scl/fi/rzqscy9bsk1vcsbupht28/Series-HS-8-10-GM-MT.jpg?rlkey=hzpjxxg596gasm8rv1tmnvgbp&dl=1">HS -8-10 GM - MT</a>
        <a href="#" data-image="https://dl.dropboxusercontent.com/scl/fi/llf9kdjqsdnnlg8x2hurg/Series-JDS-0C.jpg?rlkey=e45j517h0ullopktig5nua5lj&dl=1">JDS - 0C</a>
        <a href="#" data-image="https://dl.dropboxusercontent.com/scl/fi/klemstpsocx5js60xyg48/Series-WOOL-JUTE-LEFA-T.jpg?rlkey=7xothe8gqzwx52uqd38ndiib9&dl=1">Wool Jute Lefa Twisted</a>
        <a href="#" data-image="https://dl.dropboxusercontent.com/scl/fi/xdhyi7hnk9kexvrqpz64v/Series-WOOL-JUTE-LEFA.jpg?rlkey=plh7jjvvfvv2n0nu73m03j8yr&dl=1">Wool Jute Lefa</a>
        <a href="#" data-image="https://dl.dropboxusercontent.com/scl/fi/sovg2f0pzzd9v3knx7ihx/Series-WPL-0C.jpg?rlkey=dqnk8lwgrhy1dq30f1s133lu4&dl=1">WPL 0C</a>
        <a href="#" data-image="https://dl.dropboxusercontent.com/scl/fi/xbnjtmebqtcxk6bu52kf6/Series-Bamboo-30C.jpg?rlkey=onzn8pszkm75lafa45z9ct0rk&dl=1">Bamboo 30C</a>

        <a href="#" data-image="https://dl.dropboxusercontent.com/scl/fi/ksoowlajp1ij0lugdrsh5/Series-ALPACA-TWISTED.jpg?rlkey=xdbxxb0py6bmtj7l7bixm3pu3&dl=1">Alpaca Twisted</a>
    </div>

    <!-- Right side for image preview -->
    <div class="image-container">
        <img id="previewImage" src="" alt="Image Preview">
    </div>

    <!-- Download button -->
    <a href="#" class="download-link" id="downloadButton">Download</a>

    <script>
        const links = document.querySelectorAll(".index a");
        const previewImage = document.getElementById("previewImage");
        const downloadButton = document.getElementById("downloadButton");

        links.forEach(link => {
            link.addEventListener("click", function (event) {
                event.preventDefault();
                const imageUrl = link.getAttribute("data-image");
                previewImage.src = imageUrl;
                previewImage.style.display = "block";
                
                // Enable download button when an image is selected
                downloadButton.href = imageUrl;
                downloadButton.download = imageUrl.split('/').pop();
            });
        });
    </script>

</body>
</html>
